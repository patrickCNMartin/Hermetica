default_stages: [pre-push]
repos:
  # Ruff - linting and formatting
  # rev must track the ruff version in uv.lock: CI formats with the locked
  # version, so a split here makes the two reformat each other's output.
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.21
    hooks:
      - id: ruff-check
        args: ['--fix']
      - id: ruff-format

  # detect-secrets - secret scanning
  - repo: https://github.com/Yelp/detect-secrets
    rev: v1.5.0
    hooks:
      - id: detect-secrets
        args: ['--baseline', 'security/.baseline.security']
        # The baseline stores hashed secrets, so scanning it re-reports every
        # entry it exists to suppress.
        exclude: ^security/\.baseline\.security$
        # The baseline records the gibberish filter, so loading it imports
        # gibberish_detector - absent from this hook's isolated env otherwise.
        additional_dependencies: ['gibberish-detector']
