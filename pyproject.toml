[project]
name = "hermetica"
version = "0.1.0"
description = "Protocol Version Control and Composition with Hermetica"
requires-python = ">=3.13"

dependencies = [
    "requests",
    "python-dotenv",
    "ratelimit",
    "backoff",
]

[project.optional-dependencies]
dev = [
    "ruff",
    "detect-secrets[gibberish]",
    "pre-commit",
    "pytest",
    "pytest-cov",
    "responses",
]

[build-system]
requires = ["setuptools>=65", "wheel", "setuptools-scm>=8"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"" = "hermetica"}

[tool.setuptools.package-data]
scribe = ["*.yaml"]

[tool.ruff]
target-version = "py313"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I"]

# The modules live under hermetica/ and import as top-level packages.
[tool.ruff.lint.isort]
known-first-party = ["chronos", "seal", "compose", "scribe", "sources"]